name: Mobile App Suite CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Format & Strict Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter version
        run: flutter --version

      - name: Activate Melos CLI
        run: dart pub global activate melos

      - name: Add Pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap Melos Workspace
        run: melos bootstrap

      - name: 1. Check Dart Code Formatting
        run: melos run format:check --no-select

      - name: 2. Run Strict Static Analysis & Type Checking
        run: melos run analyze --no-select

      - name: 3. Verify Zero Code Leakage Boundary Isolation
        run: |
          echo "Verifying Customer App does not import Tasker Domain..."
          if grep -rn "linkkwork_tasker_domain" apps/customer_app | grep -v "\.dart_tool" | grep -v "pubspec.lock"; then
            echo "::error::Customer App contains illegal imports from tasker_domain!"
            exit 1
          fi

          echo "Verifying Tasker App does not import Customer Domain..."
          if grep -rn "linkkwork_customer_domain" apps/tasker_app | grep -v "\.dart_tool" | grep -v "pubspec.lock"; then
            echo "::error::Tasker App contains illegal imports from customer_domain!"
            exit 1
          fi
          echo "Zero Code Leakage validated successfully."

  unit-and-widget-tests:
    name: Unit & Widget Test Suites (180 Tests)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Activate Melos CLI
        run: dart pub global activate melos

      - name: Add Pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap Melos Workspace
        run: melos bootstrap

      - name: Run Full Mobile Test Suite
        run: melos run test --no-select

  build-validation:
    name: Android Build Validation (APK)
    runs-on: ubuntu-latest
    needs: unit-and-widget-tests
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Activate Melos CLI
        run: dart pub global activate melos

      - name: Add Pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap Melos Workspace
        run: melos bootstrap

      - name: Build Customer App Debug APK
        run: |
          cd apps/customer_app
          flutter build apk --debug

      - name: Build Tasker App Debug APK
        run: |
          cd apps/tasker_app
          flutter build apk --debug

      - name: Upload Customer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-debug
          path: apps/mobile/apps/customer_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Tasker APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasker-app-debug
          path: apps/mobile/apps/tasker_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
